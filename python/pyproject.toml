[project]
name = "babelprime"
version = "0.2.0"
description = "Python research API for BabelPrime"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["babelprime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
