[workspace]
resolver = "2"
members = [
    "crates/babelprime-arithmetic",
    "crates/babelprime-primality",
    "crates/babelprime-factor",
    "crates/babelprime-verify",
    "crates/babelprime-checkpoint",
    "crates/babelprime-ecm",
    "crates/babelprime-core",
    "crates/babelprime-api",
]
default-members = ["crates/babelprime-core", "crates/babelprime-api"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TheBabelDragon/BabelPrime"
authors = ["TheBabelDragon"]

[workspace.dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
rand_chacha = "0.3"

babelprime-arithmetic = { path = "crates/babelprime-arithmetic", version = "0.2.0" }
babelprime-primality = { path = "crates/babelprime-primality", version = "0.2.0" }
babelprime-factor = { path = "crates/babelprime-factor", version = "0.2.0" }
babelprime-verify = { path = "crates/babelprime-verify", version = "0.2.0" }
babelprime-checkpoint = { path = "crates/babelprime-checkpoint", version = "0.2.0" }
babelprime-ecm = { path = "crates/babelprime-ecm", version = "0.2.0" }
babelprime-core = { path = "crates/babelprime-core", version = "0.2.0" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
